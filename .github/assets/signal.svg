<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 20" width="880" height="20" role="img" aria-labelledby="t">
  <title id="t">Section divider: a thin line with a green signal pulse travelling across it</title>
  <defs>
    <linearGradient id="p" x1="0" x2="1">
      <stop offset="0" stop-color="#00FF66" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00FF66"/>
      <stop offset="1" stop-color="#00FF66" stop-opacity="0"/>
    </linearGradient>
    <style>
      .pulse{animation:run 7s cubic-bezier(.4,0,.6,1) infinite}
      @keyframes run{from{transform:translateX(-160px)}to{transform:translateX(900px)}}
      @media (prefers-reduced-motion:reduce){.pulse{animation:none;transform:translateX(300px)}}
    </style>
  </defs>
  <line x1="0" y1="10" x2="880" y2="10" stroke="#262624" stroke-width="1"/>
  <rect class="pulse" x="0" y="9.5" width="140" height="1" fill="url(#p)"/>
  <circle cx="0" cy="10" r="1.5" fill="#3A3A37"/><circle cx="880" cy="10" r="1.5" fill="#3A3A37"/>
</svg>
