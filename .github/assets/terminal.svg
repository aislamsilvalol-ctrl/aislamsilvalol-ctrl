<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" width="640" height="236" role="img" aria-labelledby="t d">
  <title id="t">Terminal session introducing Aislam</title>
  <desc id="d">A dark terminal. whoami answers: AI engineer, builds autonomous software and what runs it. ls ~/src lists noema, forge, isla and isahat. uptime answers: building, Santos BR, remote, shipping in public.</desc>
  <defs>
    <style>
      text{font-family:'JetBrains Mono','IBM Plex Mono','Space Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:14.5px}
      .p{fill:#00FF66}.cmd{fill:#EDEDE8}.out{fill:#9A9A94}.dim{fill:#5C5C57}
      .cursor{animation:blink 1.1s steps(1,end) infinite}
      @keyframes blink{50%{opacity:0}}
      .type{transform-origin:0 0;transform:scaleX(0);animation:type .9s steps(28,end) forwards}
      .t1{animation-delay:.4s}.t2{animation-delay:2.2s}.t3{animation-delay:4s}
      .show{opacity:0;animation:show .1s linear forwards}
      .s1{animation-delay:1.5s}.s2{animation-delay:3.3s}.s3{animation-delay:5.1s}.s4{animation-delay:5.5s}
      @keyframes type{to{transform:scaleX(1)}}
      @keyframes show{to{opacity:1}}
      @media (prefers-reduced-motion:reduce){.type{animation:none;transform:none}.show{animation:none;opacity:1}.cursor{animation:none}}
    </style>
    <clipPath id="c1"><rect class="type t1" x="0" y="40" width="640" height="26"/></clipPath>
    <clipPath id="c2"><rect class="type t2" x="0" y="92" width="640" height="26"/></clipPath>
    <clipPath id="c3"><rect class="type t3" x="0" y="144" width="640" height="26"/></clipPath>
  </defs>

  <rect width="640" height="236" rx="6" fill="#080808"/>
  <rect x=".5" y=".5" width="639" height="235" rx="6" fill="none" stroke="#1C1C1A"/>
  <!-- window chrome, monochrome on purpose -->
  <circle cx="18" cy="16" r="4" fill="#2A2A28"/><circle cx="32" cy="16" r="4" fill="#2A2A28"/><circle cx="46" cy="16" r="4" fill="#2A2A28"/>
  <text class="dim" x="320" y="20" text-anchor="middle" style="font-size:11px;letter-spacing:1.5px">aislam@dev — zsh</text>

  <g clip-path="url(#c1)"><text x="24" y="58" xml:space="preserve"><tspan class="p">aislam@dev:~$</tspan><tspan class="cmd"> whoami</tspan></text></g>
  <text class="out show s1" x="24" y="84">AI engineer. Builds autonomous software and what runs it.</text>

  <g clip-path="url(#c2)"><text x="24" y="110" xml:space="preserve"><tspan class="p">aislam@dev:~$</tspan><tspan class="cmd"> ls ~/src</tspan></text></g>
  <text class="out show s2" x="24" y="136" xml:space="preserve">noema/   forge/   isla/   isahat/</text>

  <g clip-path="url(#c3)"><text x="24" y="162" xml:space="preserve"><tspan class="p">aislam@dev:~$</tspan><tspan class="cmd"> uptime</tspan></text></g>
  <text class="out show s3" x="24" y="188">building · Santos, BR · remote · shipping in public</text>

  <text class="show s4" x="24" y="216" xml:space="preserve"><tspan class="p">aislam@dev:~$</tspan><tspan class="cmd"> </tspan><tspan class="p cursor">▌</tspan></text>
</svg>
