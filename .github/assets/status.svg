<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 176" width="640" height="176" role="img" aria-labelledby="t d">
  <title id="t">System status</title>
  <desc id="d">AI systems: active. Autonomous software: building. Open source: active. Security: exploring. Each state is written out in text, not only shown by colour.</desc>
  <defs>
    <style>
      text{font-family:'JetBrains Mono','IBM Plex Mono','Space Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:14px}
      .h{fill:#5C5C57;font-size:11px;letter-spacing:2.5px}
      .k{fill:#9A9A94}.v{fill:#EDEDE8}.n{fill:#5C5C57;font-size:12.5px}
      .on{fill:#00FF66}.build{fill:#7FBF8E}.learn{fill:#6B6B66}
      .pulse{animation:pulse 2.6s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
      @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
    </style>
  </defs>
  <rect width="640" height="176" rx="6" fill="#080808"/>
  <rect x=".5" y=".5" width="639" height="175" rx="6" fill="none" stroke="#1C1C1A"/>
  <text class="h" x="24" y="34">SYSTEM STATUS</text>
  <line x1="24" y1="44" x2="616" y2="44" stroke="#1C1C1A"/>

  <g xml:space="preserve">
    <text class="k" x="24"  y="72">AI SYSTEMS</text>
    <circle class="on pulse" cx="232" cy="67" r="4"/>
    <text class="v" x="246" y="72">ACTIVE</text>
    <text class="n" x="360" y="72">noema · production</text>

    <text class="k" x="24"  y="100">AUTONOMOUS SOFTWARE</text>
    <circle class="build" cx="232" cy="95" r="4" fill="none" stroke="#7FBF8E" stroke-width="1.5"/>
    <text class="v" x="246" y="100">BUILDING</text>
    <text class="n" x="360" y="100">forge · usina</text>

    <text class="k" x="24"  y="128">OPEN SOURCE</text>
    <circle class="on pulse" cx="232" cy="123" r="4" style="animation-delay:-1.3s"/>
    <text class="v" x="246" y="128">ACTIVE</text>
    <text class="n" x="360" y="128">4 public systems</text>

    <text class="k" x="24"  y="156">SECURITY</text>
    <path class="learn" d="M228 151 h8 v0 a4 4 0 0 1 -8 0 z"/><circle cx="232" cy="151" r="4" fill="none" stroke="#6B6B66" stroke-width="1.5"/>
    <text class="v" x="246" y="156">EXPLORING</text>
    <text class="n" x="360" y="156">isahat · threat models · CI scans</text>
  </g>
</svg>
