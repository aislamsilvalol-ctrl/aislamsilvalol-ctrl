      .stream{font-size:13px;fill:#00FF66;letter-spacing:2px}
      .cursor{animation:blink 1.1s steps(1,end) infinite}
      @keyframes blink{50%{opacity:0}}
      .col{animation:fall linear infinite}
      .c1{animation-duration:14s}.c2{animation-duration:19s;animation-delay:-7s}.c3{animation-duration:11s;animation-delay:-3s}
      .c4{animation-duration:23s;animation-delay:-12s}.c5{animation-duration:16s;animation-delay:-9s}.c6{animation-duration:13s;animation-delay:-5s}
      .c7{animation-duration:21s;animation-delay:-15s}.c8{animation-duration:17s;animation-delay:-2s}
      @keyframes fall{from{transform:translateY(-240px)}to{transform:translateY(240px)}}
      .dot{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
      @media (prefers-reduced-motion:reduce){.col,.cursor,.dot{animation:none}}
    </style>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
