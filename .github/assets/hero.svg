<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-labelledby="t d">
  <title id="t">Aislam Camarini Mastro — AI engineer, autonomous systems builder</title>
  <desc id="d">Dark banner with the name Aislam Camarini Mastro, the line "AI systems / autonomous software / open source", the domain aislam.dev with a blinking cursor, and a faint vertical stream of characters on the right.</desc>
  <defs>
    <style>
      .mono{font-family:'JetBrains Mono','IBM Plex Mono','Space Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
